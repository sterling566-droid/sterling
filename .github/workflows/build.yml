name: Build Sterling APK (Native)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners already have the Android SDK preinstalled
      # (ANDROID_HOME/ANDROID_SDK_ROOT set), so there's no multi-gigabyte
      # SDK/NDK download here the way there was with buildozer - this
      # build should be far faster and much less fragile.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sterling-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
